name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # esbuild hace falta para comprobar que app.js es la compilación
      # actual de src/app.jsx (tests/build.test.mjs).
      - name: Instalar dependencias
        run: npm ci
      - name: Tests
        run: node --test tests/*.test.js tests/*.test.mjs
